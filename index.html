<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Quick Note Taker</title>
    <style>
        *{box-sizing: border-box; margin :0; padding :0;}
        body {
            font-family: system-ui;
            padding: 20px;
            background: #f4f4f4;
            display: flex;
            flex-direction: column;
            height: 95vh;
        }

        .container {
            display: flex;
            flex: 1;
            gap: 20px;
            margin-top: 10px;
        }

        #sidebar {
            width: 250px;
            background: white;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #ddd;
            display: flex;
            flex-direction: column;
        }

        #note-list {
            flex: 1;
            overflow-y: auto;
            margin-top: 10px;
        }

        .note-item {
            padding: 10px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            font-size: 14px;
            position: relative;
        }

        .note-item:hover {
            background: #f0f0f0;
        }

        .note-item.active {
            background: #eef2f7;
            font-weight: bold;
        }

        .delete-btn {
            position: absolute;
            right: 5px;
            top: 8px;
            background: #ff4d4d;
            color: white;
            border: none;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 11px;
            cursor: pointer;
        }

        .editor {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        #toolbar {
            display: flex;
            gap: 5px;
            margin-bottom: 10px;
        }

        textarea {
            width: 100%;
            flex: 1;
            font-size: 16px;
            padding: 15px;
            border-radius: 5px;
            border: 1px solid #ccc;
            resize: none;
        }

        .controls {
            margin-top: 10px;
        }

        button {
            padding: 8px 15px;
            font-size: 14px;
            background: #316357;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background: #254d43;
        }

        #save_status {
            font-size: 14px;
            color: #666;
            margin-bottom: 5px;
        }

        #word-count {
            font-size: 13px;
            color: #555;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <h1>📝 Quick Note Taker</h1>

    <div class="container">
        <div id="sidebar">
            <h3 style="margin-top:0">My Notes</h3>
            <div id="note-list"></div>
        </div>

        <div class="editor">
            <p id="save_status">Ready</p>
            
            <div id="toolbar">
                <button id="open-file">📂 Open File</button>
                <button id="save">💾 Save Note</button>
                <button id="save-as">💾 Save As</button>
                <button id="font-increase">A+</button>
                <button id="font-decrease">A-</button>
            </div>

            <textarea id="note" placeholder="Start typing your note..."></textarea>
            
            <p id="word-count">Words: 0 | Characters: 0</p>

            <div class="controls">
                <button id="new-note">📄 New Note</button>
            </div>
        </div>
    </div>

    <script src="renderer.js"></script>
</body>
</html>
